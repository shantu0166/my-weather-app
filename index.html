<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>शेतकरी हवामान डॅशबोर्ड</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(23, 37, 84, 0.6);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --accent: #38bdf8;
      --green: #22c55e;
      --orange: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; }

    #fx-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
    .app { position: relative; z-index: 2; max-width: 540px; margin: 0 auto; padding: 16px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .location-tag { font-size: 0.8rem; color: #94a3b8; }
    .badge { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent); color: var(--accent); font-size: 0.72rem; padding: 3px 8px; border-radius: 99px; font-weight: 600; }

    .glass { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    
    .spray-card { display: flex; align-items: center; justify-content: space-between; border-left: 5px solid var(--green); }
    .spray-card.warn { border-left-color: var(--orange); }
    .status-text h3 { font-size: 1.05rem; font-weight: 700; }
    .status-text p { font-size: 0.82rem; color: #cbd5e1; margin-top: 3px; }

    .hero { text-align: center; padding: 20px 10px; }
    .main-temp { font-size: 3.6rem; font-weight: 800; line-height: 1; }
    .weather-desc { font-size: 1rem; color: #cbd5e1; margin-top: 6px; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    .metric { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; text-align: center; }
    .metric span { display: block; font-size: 0.75rem; color: #94a3b8; }
    .metric b { font-size: 0.95rem; margin-top: 3px; display: block; }

    .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .tab { flex: 1; text-align: center; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
    .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
    .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; align-items: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 10px; font-size: 0.82rem; }
    .row b { font-size: 0.85rem; }
    .rain-vol { color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="fx-canvas"></canvas>

  <div class="app">
    <div class="top-bar">
      <div>
        <h2>छत्रपती संभाजीनगर</h2>
        <div class="location-tag">अक्षांश: 19.8762° N, रेखांश: 75.3433° E</div>
      </div>
      <span class="badge">Google WeatherNext</span>
    </div>

    <div class="glass spray-card" id="sprayBox">
      <div class="status-text">
        <h3 id="sprayTitle">स्थिती तपासत आहे...</h3>
        <p id="spraySub">हवामानाचे विश्लेषण सुरू आहे</p>
      </div>
      <div style="font-size: 1.8rem;" id="sprayIcon">🌱</div>
    </div>

    <div class="glass hero">
      <div class="main-temp" id="tempDisplay">--°C</div>
      <div class="weather-desc" id="weatherCond">माहिती लोड होत आहे...</div>

      <div class="metrics-grid">
        <div class="metric"><span>पाऊस</span><b id="mRain">-- मिमी</b></div>
        <div class="metric"><span>वाऱ्याचा वेग</span><b id="mWind">-- किमी/तास</b></div>
        <div class="metric"><span>हवेतील आर्द्रता</span><b id="mHum">--%</b></div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabHourly" onclick="switchView('hourly')">पुढील तास (वेळ व तारीख)</div>
      <div class="tab" id="tabDaily" onclick="switchView('daily')">१० दिवसांचा अंदाज</div>
    </div>

    <div class="glass" style="padding: 10px;">
      <div class="list" id="forecastContainer"></div>
    </div>
  </div>

  <script>
    const LAT = 19.8762;
    const LON = 75.3433;
    let globalData = null;
    let activeTab = 'hourly';

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let activeFx = 'clear';

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function initFx(type) {
      activeFx = type;
      particles = [];
      const count = type === 'rain' ? 80 : (type === 'wind' ? 35 : 0);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          len: Math.random() * 15 + 10,
          speed: Math.random() * 8 + 6
        });
      }
    }

    function renderFx() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (activeFx === 'rain') {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
        ctx.lineWidth = 1.3;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 2, p.y + p.len);
          ctx.stroke();
          p.y += p.speed;
          if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
        });
      } else if (activeFx === 'wind') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = 1.6;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.len * 2, p.y);
          ctx.stroke();
          p.x += p.speed * 1.5;
          if (p.x > canvas.width) { p.x = -50; p.y = Math.random() * canvas.height; }
        });
      }
      requestAnimationFrame(renderFx);
    }
    renderFx();

    async function loadForecast() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&forecast_days=10&timezone=auto`;

      try {
        const res = await fetch(url);
        globalData = await res.json();
        
        const h = globalData.hourly;
        
        // Match strictly with current local hour
        const now = new Date();
        let currentIndex = h.time.findIndex(t => new Date(t) >= now);
        if (currentIndex === -1) currentIndex = 0;

        const curTemp = Math.round(h.temperature_2m[currentIndex]);
        const curRain = h.precipitation[currentIndex];
        const curWind = Math.round(h.wind_speed_10m[currentIndex]);
        const curHum = h.relative_humidity_2m[currentIndex];

        document.getElementById('tempDisplay').innerText = `${curTemp}°C`;
        document.getElementById('mRain').innerText = `${curRain} मिमी`;
        document.getElementById('mWind').innerText = `${curWind} किमी/तास`;
        document.getElementById('mHum').innerText = `${curHum}%`;

        if (curRain > 0.1) {
          initFx('rain');
          document.getElementById('weatherCond').innerText = 'पावसाची शक्यता / सरी';
        } else if (curWind > 18) {
          initFx('wind');
          document.getElementById('weatherCond').innerText = 'वेगवान वारे';
        } else {
          initFx('clear');
          document.getElementById('weatherCond').innerText = 'स्वच्छ व स्थिर वातावरण';
        }

        const sprayBox = document.getElementById('sprayBox');
        if (curWind < 15 && curRain === 0) {
          sprayBox.className = 'glass spray-card';
          document.getElementById('sprayTitle').innerText = 'फवारणीसाठी योग्य वेळ ✅';
          document.getElementById('spraySub').innerText = 'हवेचा वेग कमी आहे आणि पाऊस नाही.';
          document.getElementById('sprayIcon').innerText = '🌿';
        } else {
          sprayBox.className = 'glass spray-card warn';
          document.getElementById('sprayTitle').innerText = 'फवारणी टाळा (काळजी घ्या) ⚠️';
          document.getElementById('spraySub').innerText = curWind >= 15 ? 'हवेचा वेग जास्त आहे (औषध उडण्याचा धोका)' : 'पाऊस पडण्याची शक्यता आहे.';
          document.getElementById('sprayIcon').innerText = '🚫';
        }

        renderLists(currentIndex);
      } catch (err) {
        document.getElementById('weatherCond').innerText = 'डेटा लोड करताना त्रुटी आली';
      }
    }

    function switchView(tab) {
      activeTab = tab;
      document.getElementById('tabHourly').className = `tab ${tab === 'hourly' ? 'active' : ''}`;
      document.getElementById('tabDaily').className = `tab ${tab === 'daily' ? 'active' : ''}`;
      loadForecast();
    }

    function renderLists(startIdx = 0) {
      if (!globalData) return;
      const container = document.getElementById('forecastContainer');
      let html = '';

      if (activeTab === 'hourly') {
        const h = globalData.hourly;
        // Remaining hours of today + following 24 hours (total ~30 hours)
        const totalHours = Math.min(startIdx + 30, h.time.length);

        for (let i = startIdx; i < totalHours; i++) {
          const d = new Date(h.time[i]);
          const dateLabel = `${d.getDate()}/${d.getMonth()+1}`;
          const timeLabel = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

          html += `
            <div class="row">
              <div><b>${timeLabel}</b><br><small style="color:#94a3b8;">${dateLabel}</small></div>
              <span>${Math.round(h.temperature_2m[i])}°C</span>
              <span class="rain-vol">💧 ${h.precipitation[i]} मिमी</span>
              <span>💨 ${Math.round(h.wind_speed_10m[i])} किमी</span>
            </div>`;
        }
      } else {
        const d = globalData.daily;
        const marathiDays = ['रवि', 'सोम', 'मंगळ', 'बुध', 'गुरु', 'शुक्र', 'शनि'];

        for (let i = 0; i < d.time.length; i++) {
          const dt = new Date(d.time[i]);
          const dayName = marathiDays[dt.getDay()];
          const dateStr = `${dt.getDate()}/${dt.getMonth()+1}`;

          html += `
            <div class="row">
              <div><b>${dayName}</b><br><small style="color:#94a3b8;">${dateStr}</small></div>
              <span>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</span>
              <span class="rain-vol">💧 ${d.precipitation_sum[i]} मिमी</span>
              <span>💨 ${Math.round(d.wind_speed_10m_max[i])} किमी</span>
            </div>`;
        }
      }
      container.innerHTML = html;
    }

    loadForecast();
  </script>
</body>
</html>
